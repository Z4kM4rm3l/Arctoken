[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arctoken"
version = "0.0.1"
description = "Static analysis for LLM agent loops. Finds the architecture patterns that make token costs compound."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zak Marmel" }]
keywords = ["llm", "agents", "static-analysis", "token-optimization", "prompt-caching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Z4kM4rm3l/Arctoken"
Issues = "https://github.com/Z4kM4rm3l/Arctoken/issues"

[project.scripts]
arctoken = "arctoken.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mutmut",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90

[tool.mutmut]
source_paths = [
    "src/arctoken/detectors",
    "src/arctoken/walker.py",
    "src/arctoken/payloads.py",
]
also_copy = ["src"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
